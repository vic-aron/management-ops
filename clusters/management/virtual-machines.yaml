apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: virtual-machines-pre-config
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: virtual-machines
  path: "./virtual-machines"
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: platform-configs
    - name: platform-post-configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
