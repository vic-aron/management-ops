apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: https
      hostname: "*.shinoval.work"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: shinoval-wildcard-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.shinoval.work/gateway-access: "public"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shinoval-wildcard
  namespace: envoy-gateway-system
spec:
  secretName: shinoval-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.shinoval.work"
    - "shinoval.work"
