apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public-gateway-proxy
  listeners:
    - name: https
      hostname: "*.shinoval.work"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: shinoval-wildcard-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.shinoval.work/gateway-access: "public"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-gateway-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: "10.212.212.72"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shinoval-wildcard
  namespace: envoy-gateway-system
spec:
  secretName: shinoval-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.shinoval.work"
    - "shinoval.work"
