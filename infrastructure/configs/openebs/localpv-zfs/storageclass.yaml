apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-localpv-zfs-128k-retain
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  recordsize: "128k"
  compression: "lz4"
  dedup: "off"
  fstype: "zfs"
  poolname: "tank"
  atime: "off"
  thinProvision: "yes"
  logbias: "throughput"
  quotatype: "refquota"
provisioner: zfs.csi.openebs.io
volumeBindingMode: WaitForFirstConsumer
---
