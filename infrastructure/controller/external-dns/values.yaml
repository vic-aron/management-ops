apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-values
  namespace: external-dns
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    serviceMonitor:
      enabled: true
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-key
            key: apiKey
    gatewayNamespace: envoy-gateway-system
