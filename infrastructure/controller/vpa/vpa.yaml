apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/autoscaler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: vpa
        namespace: kube-system
  releaseName: vertical-pod-autoscaler
  install:
    crds: Create
    createNamespace: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: vpa-values
      valuesKey: values.yaml
      optional: false
