apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-values
  namespace: kube-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    admissionController:
      enabled: true
      replicas: 1
      podDisruptionBudget:
        enabled: false
    recommender:
      enabled: true
      replicas: 1
      podDisruptionBudget:
        enabled: false
    updater:
      enabled: true
      replicas: 1
      podDisruptionBudget:
        enabled: false
