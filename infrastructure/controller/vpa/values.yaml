apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-values
  namespace: kube-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    admissionController:
      enabled: true
      replicas: 1
      podDisruptionBudget: {}
    recommender:
      enabled: true
      replicas: 1
      podDisruptionBudget: {}
    updater:
      enabled: true
      replicas: 1
      podDisruptionBudget: {}
