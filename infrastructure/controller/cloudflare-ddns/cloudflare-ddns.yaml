apiVersion: v1
kind: Namespace
metadata:
  name: ddns
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloudflare-ddns
  namespace: ddns
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/timothymiller/cloudflare-ddns
  ref:
    semver: "0.2.2"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
  namespace: ddns
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: cloudflare-ddns
    namespace: ddns
  releaseName: cloudflare-ddns
  install:
    crds: Create
    createNamespace: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: cloudflare-ddns-values
      valuesKey: values.yaml
      optional: false
