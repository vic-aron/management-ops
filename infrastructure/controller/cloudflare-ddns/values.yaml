apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-ddns-values
  namespace: ddns
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    cloudflare:
      existingSecret: cloudflare-ddns
    domains: shinoval.work,www.shinoval.work
    ip4Provider: cloudflare.trace
    ip6Provider: cloudflare.trace
    proxied: "true"
    ttl: 300
    recordComment: "managed by cloudflare-ddns"
    emoji: "false"
    updateCron: "@every 5m"
    updateOnStart: true
    deleteOnStop: false
    deleteOnFailure: false
