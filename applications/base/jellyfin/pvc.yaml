apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-movies
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=3.1.1
    - ro
    - dir_mode=0555
    - file_mode=0444
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: "//10.212.212.50/movies##"
    readOnly: true
    volumeAttributes:
      source: "//10.212.212.50/movies"
    nodeStageSecretRef:
      name: smb-creds
      namespace: jellyfin
---
