apiVersion: v1
kind: Service
metadata:
  name: jellyfin-lb
  namespace: jellyfin
  annotations:
    metallb.io/loadBalancerIPs: 10.212.212.77
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: 8096
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: jellyfin
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    external-dns.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - jellyfin.shinoval.work
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-private
  namespace: jellyfin
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - jellyfin.shinoval.work
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
          weight: 1
