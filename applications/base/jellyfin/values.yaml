apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-values
  namespace: jellyfin
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    persistence:
      config:
        enabled: true
        type: pvc
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: 'openebs-localpv-zfs-128k-delete'
        # existingClaim: ''
        readOnly: true
      media:
        enabled: false
        type: nfs
        # existingClaim: ''
        nfsServer: "10.212.212.50"
        nfsPath: "/media"
        readOnly: true
      cache:
        enabled: true
        type: pvc
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: 'openebs-localpv-zfs-128k-delete'
        # existingClaim: ''

    deploymentStrategy:
      type: Recreate

    securityContext:
      capabilities:
      #   drop:
      #   - ALL
      readOnlyRootFilesystem: false
      # runAsNonRoot: true
      # runAsUser: 1000

    volumes:
      - name: movies
        persistentVolumeClaim:
          claimName: jellyfin-movies

      - name: series
        persistentVolumeClaim:
          claimName: jellyfin-series

      - name: music
        persistentVolumeClaim:
          claimName: jellyfin-music

    volumeMounts:
      - name: movies
        mountPath: /media/movies
        readOnly: true

      - name: series
        mountPath: /media/series
        readOnly: true

      - name: music
        mountPath: /media/music
        readOnly: true
