apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kubevirt-operator.yaml
  - kubevirt-network-policies.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      group: apps
      version: v1
      kind: Deployment
      name: virt-operator
      labelSelector: "kubevirt.io=virt-operator"
