apiVersion: v1
kind: Namespace
metadata:
  name: capi-operator-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/cluster-api-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: cluster-api-operator
      version: "0.30.0"
      sourceRef:
        kind: HelmRepository
        name: capi-operator
        namespace: capi-operator-system
  releaseName: capi-operator
  install:
    crds: Create
    createNamespace: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
