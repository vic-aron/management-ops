#name: enable-metrics
#content: |
#  [plugins."io.containerd.server.v1.metrics"]
#    address = "10.212.212.244:11234"
#---
#apiVersion: v1alpha1
#kind: KmsgLogConfig
#name: remote-log
#url: tcp://10.212.212.244:5044/
#---
#apiVersion: v1alpha1
#kind: EventSinkConfig
#endpoint: 10.212.212.244:3247
#---
#apiVersion: v1alpha1
