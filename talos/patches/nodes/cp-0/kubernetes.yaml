apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: openvswitch
---
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.212.212.0/24
labels:
  kube-ovn/role: master
  node-role.kubernetes.io/control-plane: ""
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: true
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: device-ownership
content: |
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
#---
#apiVersion: v1alpha1
